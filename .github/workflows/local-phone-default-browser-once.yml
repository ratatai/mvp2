name: Local phone default browser check (one-time)

on:
  push:
    branches: [ci/phone-default-browser-once-179131dd]
    paths: [.github/workflows/local-phone-default-browser-once.yml]

permissions:
  contents: read

concurrency:
  group: local-phone-default-browser-once
  cancel-in-progress: false

env:
  # Reviewed head of PR #8 (feature/category-first-search).
  APP_SHA: 179131dd597bdedf55f4c76881e588090e0707b8
  # Official v2.120.0 (2026-10-06); source accepts PG17 and this config.
  SUPABASE_CLI_VERSION: '2.120.0'
  # Pin legacy Docker backend: container IDs and status -o env below depend on it.
  SUPABASE_EXPERIMENTAL_STACK: '0'
  SUPABASE_NO_KEYRING: '1'
  SUPABASE_PROJECT_ID: ratatai-marketplace
  CI: 'true'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  search-e2e:
    name: seller phone defaults and browser checkbox
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Require a verified, pinned Supabase CLI version
        run: |
          if ! [[ "$SUPABASE_CLI_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::SUPABASE_CLI_VERSION is not a pinned X.Y.Z release. Set a verified version before dispatching."
            exit 1
          fi

      - name: Check out the reviewed application commit
        uses: actions/checkout@v6
        with:
          ref: ${{ env.APP_SHA }}
          persist-credentials: false
          fetch-depth: 1

      - name: Confirm the checked-out commit
        run: |
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$APP_SHA" ]; then
            echo "::error::Checked out $actual, expected $APP_SHA."
            exit 1
          fi

      - name: Reject production env files, linked metadata and remote credentials
        run: |
          set -u
          problems=0
          for f in .env .env.local .env.production .env.*.local supabase/config.json; do
            if [ -e "$f" ]; then echo "::error::$f must not exist in this run."; problems=1; fi
          done
          for p in supabase/.temp supabase/.branches; do
            if [ -e "$p" ]; then echo "::error::$p (linked Supabase metadata) must not exist."; problems=1; fi
          done
          for v in E2E_ISO_SUPABASE_URL E2E_ISO_ANON_KEY E2E_ISO_A_EMAIL E2E_ISO_A_PASSWORD E2E_ISO_B_EMAIL E2E_ISO_B_PASSWORD E2E_EMAIL E2E_PASSWORD SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF SUPABASE_SERVICE_ROLE_KEY NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY; do
            if [ -n "${!v:-}" ]; then echo "::error::$v must not be set before the local stack starts."; problems=1; fi
          done
          if ! grep -Eq '^major_version = 17$' supabase/config.toml; then
            echo "::error::supabase/config.toml does not set db.major_version = 17."; problems=1
          fi
          exit "$problems"

      - name: Assert Docker is available and no Supabase stack exists
        id: fresh
        run: |
          docker info --format '{{.ServerVersion}}' >/dev/null
          if [ -n "$(docker ps -aq --filter 'name=supabase_')" ]; then
            echo "::error::Found existing supabase_* containers; expected a fresh runner."
            exit 1
          fi
          if [ -n "$(docker volume ls -q --filter 'name=supabase_')" ]; then
            echo "::error::Found existing Supabase volumes; expected a fresh runner."
            exit 1
          fi
          for port in 54321 54322 3100; do
            if ss -ltn "( sport = :$port )" | grep -q LISTEN; then
              echo "::error::Port $port is already in use."
              exit 1
            fi
          done

          echo 'allowed=true' >> "$GITHUB_OUTPUT"

      - name: Disable the demo seed for this disposable database
        # Runner-only edit to the checkout; never committed. Migrations stay
        # enabled and are applied in their checked-in order by `supabase start`.
        run: |
          awk '
            /^\[/ { section = $0 }
            section == "[db.seed]" && /^enabled = true$/ { print "enabled = false"; changed = 1; next }
            { print }
            END { if (!changed) exit 1 }
          ' supabase/config.toml > "$RUNNER_TEMP/config.toml"
          mv "$RUNNER_TEMP/config.toml" supabase/config.toml
          git diff --stat -- supabase/config.toml
          echo "Migrations, in apply order:"
          ls -1 supabase/migrations | LC_ALL=C sort

      - name: Install the pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Confirm the CLI version
        run: |
          installed="$(supabase --version | tr -d '[:space:]')"
          if [ "$installed" != "$SUPABASE_CLI_VERSION" ]; then
            echo "::error::Installed Supabase CLI $installed, expected $SUPABASE_CLI_VERSION."
            exit 1
          fi

      - name: Start a new disposable local stack (applies migrations)
        # Fails the job if any migration fails; nothing is skipped or retried.
        # start prints local keys; capture all output privately and delete it.
        # Failure reports its exit status without publishing key-bearing logs.
        run: |
          set +x
          umask 077
          start_log="$(mktemp "$RUNNER_TEMP/start.XXXXXX")"
          trap 'rm -f "$start_log"' EXIT
          if supabase start -x studio,edge-runtime,logflare,vector >"$start_log" 2>&1; then
            echo "Disposable stack started."
          else
            code=$?
            echo "::error::Local stack start/migrations failed (exit $code); raw output suppressed because it can contain keys."
            exit "$code"
          fi

      - name: Export the local API URL and anon key only
        # `supabase status` output contains other keys (service_role, JWT
        # secret, DB URL). It is written to a private temp file, never printed
        # or sourced, and deleted straight after two values are read from it.
        run: |
          set +x
          umask 077
          status_file="$(mktemp "$RUNNER_TEMP/status.XXXXXX")"
          trap 'rm -f "$status_file"' EXIT
          if ! supabase status -o env >"$status_file" 2>/dev/null; then
            echo "::error::supabase status failed (output suppressed: it contains keys)."
            exit 1
          fi
          read_value() {
            grep -E "^$1=" "$status_file" | head -n 1 | cut -d= -f2- | sed -e 's/^"//' -e 's/"$//'
          }
          api_url="$(read_value API_URL)"
          anon_key="$(read_value ANON_KEY)"
          if [ -z "$api_url" ] || [ -z "$anon_key" ]; then
            echo "::error::Could not read API_URL and ANON_KEY from local status."
            exit 1
          fi
          echo "::add-mask::$anon_key"
          if ! [[ "$api_url" =~ ^http://(127\.0\.0\.1|localhost|\[::1\]):[0-9]+/?$ ]]; then
            echo "::error::Local API URL is not a loopback http URL."
            exit 1
          fi
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$api_url"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$anon_key"
          } >>"$GITHUB_ENV"
          echo "Local API URL: $api_url"

      - name: Assert loopback URL and a real local Postgres 17
        run: |
          if ! [[ "$NEXT_PUBLIC_SUPABASE_URL" =~ ^http://(127\.0\.0\.1|localhost|\[::1\]):[0-9]+/?$ ]]; then
            echo "::error::NEXT_PUBLIC_SUPABASE_URL is not loopback."
            exit 1
          fi
          db_container="supabase_db_${SUPABASE_PROJECT_ID}"
          version_num="$(docker exec "$db_container" psql -U postgres -d postgres -tAc 'show server_version_num' | tr -d '[:space:]')"
          echo "Local server_version_num: $version_num"
          if ! [[ "$version_num" =~ ^17[0-9]{4}$ ]]; then
            echo "::error::Local database is not Postgres 17."
            exit 1
          fi
          applied="$(docker exec "$db_container" psql -U postgres -d postgres -tAc 'select count(*) from supabase_migrations.schema_migrations' | tr -d '[:space:]')"
          expected="$(ls -1 supabase/migrations/*.sql | wc -l | tr -d '[:space:]')"
          echo "Applied migrations: $applied / $expected"
          if [ "$applied" != "$expected" ]; then
            echo "::error::Not every checked-in migration was applied."
            exit 1
          fi
          listings="$(docker exec "$db_container" psql -U postgres -d postgres -tAc 'select count(*) from public.listings' | tr -d '[:space:]')"
          echo "Listings in fresh database: $listings"
          test "$listings" = 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci


      - name: Verify initial profile and phone visibility transitions
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { randomBytes } from 'node:crypto';
          import { appendFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import { createClient } from '@supabase/supabase-js';

          const origin = process.env.NEXT_PUBLIC_SUPABASE_URL;
          if (origin !== 'http://127.0.0.1:54321') throw new Error('Expected fixed loopback API');
          const key = process.env.NEXT_PUBLIC_SUPABASE_ANON_KEY;
          if (!key) throw new Error('Expected local public key');
          const options = {
            auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false },
            global: { fetch: (input, init) => {
              const url = input instanceof Request ? input.url : String(input);
              if (new URL(url).origin !== origin) throw new Error('Nonlocal request refused');
              return fetch(input, { ...init, redirect: 'error' });
            }}
          };
          const owner = createClient(origin, key, options);
          const guest = createClient(origin, key, options);
          const expectData = (result, label) => {
            if (result.error || !result.data) throw new Error(label + ' failed; response suppressed');
            return result.data;
          };
          const phone = '+12025550123';
          const signup = expectData(await owner.auth.signUp({
            email: 'e2e-phone-owner@example.test',
            password: randomBytes(32).toString('hex')
          }), 'Synthetic signup');
          const id = signup.user?.id;
          if (!signup.session || !/^[a-f0-9]{8}(?:-[a-f0-9]{4}){3}-[a-f0-9]{12}$/.test(id ?? '')) {
            throw new Error('Expected confirmed synthetic owner');
          }
          const initial = expectData(await owner.from('profiles').select('phone,phone_is_public').eq('id', id).single(), 'Initial profile');
          assert.ok(initial.phone === null, 'Fresh account must have no stored phone');
          assert.equal(initial.phone_is_public, false, 'New profile must default to private');
          console.log('PASS new profile defaults to private');
          const listing = expectData(await owner.from('listings').insert({
            user_id: id, category: 'padangos', title: 'Synthetic phone visibility fixture',
            description: 'Synthetic local fixture for the phone visibility check.',
            condition: 'used', price: 100, quantity: 4, city: 'Vilnius', status: 'draft',
            slug: 'e2e-phone-visibility-fixture',
            specs: { brand: 'E2E', width: 205, aspect_ratio: 55, diameter: 16, season: 'summer' }
          }).select('id').single(), 'Fixture listing');
          if (!/^[a-f0-9]{8}(?:-[a-f0-9]{4}){3}-[a-f0-9]{12}$/.test(listing.id)) throw new Error('Invalid fixture ID');
          execFileSync('docker', ['exec', 'supabase_db_' + process.env.SUPABASE_PROJECT_ID,
            'psql', '-X', '-U', 'postgres', '-d', 'postgres', '-v', 'ON_ERROR_STOP=1',
            '-c', "update public.listings set status = 'active', moderation_status = 'approved' where id = '" + listing.id + "'"
          ], { stdio: 'ignore' });
          const guestPhone = async () => expectData(await guest.from('listing_sellers')
            .select('phone').eq('listing_id', listing.id).single(), 'Anonymous approved listing view').phone;
          assert.ok(await guestPhone() === null, 'Fresh profile leaked a phone');
          const save = async (enabled) => {
            const saved = expectData(await owner.from('profiles').update({phone, phone_is_public: enabled})
              .eq('id', id).select('phone,phone_is_public').single(), 'Owner profile save');
            assert.ok(saved.phone === phone && saved.phone_is_public === enabled, 'Owner profile did not persist');
          };
          const first = expectData(await owner.from('profiles').update({phone})
            .eq('id', id).select('phone_is_public').single(), 'First profile save');
          assert.equal(first.phone_is_public, false);
          assert.ok(await guestPhone() === null, 'First profile save with show disabled leaked the number');
          console.log('PASS first profile save with visibility disabled');
          await save(true);
          assert.ok(await guestPhone() === phone, 'Explicitly public phone was not visible');
          console.log('PASS phone displayed after enabling visibility');
          await save(false);
          assert.ok(await guestPhone() === null, 'Phone remained visible after disabling');
          console.log('PASS phone hidden again after disabling visibility');
          const browserEmail = 'e2e-phone-browser@example.test';
          const browserPassword = randomBytes(32).toString('hex');
          console.log('::add-mask::' + browserPassword);
          const browserOwner = createClient(origin, key, options);
          const browserSignup = expectData(await browserOwner.auth.signUp({email: browserEmail, password: browserPassword}), 'Browser fixture signup');
          if (!browserSignup.session) throw new Error('Browser fixture was not confirmed');
          appendFileSync(process.env.GITHUB_ENV, 'E2E_EMAIL=' + browserEmail + '\nE2E_PASSWORD=' + browserPassword + '\n');
          NODE

      - name: Install Chromium
        run: |
          npx --no-install playwright install --with-deps chromium

      - name: Check a new seller's profile in Chromium
        run: |
          cat > tests/e2e/phone-default-once.spec.ts <<'SPEC'
          import { expect, test } from '@playwright/test';
          import { LT, routes } from './helpers';

          test('new seller phone visibility checkbox is unchecked', async ({ page }) => {
            const email = process.env.E2E_EMAIL ?? '';
            const password = process.env.E2E_PASSWORD ?? '';
            if (email !== 'e2e-phone-browser@example.test' || !/^[a-f0-9]{64}$/.test(password)) {
              throw new Error('Expected synthetic local browser fixture');
            }
            await page.goto(routes.login('lt'));
            await page.getByLabel(LT.email).fill(email);
            await page.getByLabel(LT.password).fill(password);
            await page.getByRole('button', { name: LT.loginSubmit }).click();
            await expect(page).toHaveURL(/\/lt\/mano(?:[/?#]|$)/);
            await page.goto('/lt/mano/profilis');
            const checkbox = page.locator('input[type="checkbox"][name="phoneIsPublic"]');
            await expect(checkbox).toBeVisible();
            await expect(checkbox).not.toBeChecked();
          });
          SPEC
          npx --no-install playwright test tests/e2e/phone-default-once.spec.ts \
            --project=desktop --workers=1 --retries=0 --trace=off --reporter=list

      - name: Stop and discard the local stack
        # Never stop anything if the fresh-runner guard rejected this host.
        if: always() && steps.fresh.outputs.allowed == 'true'
        run: |
          supabase stop --no-backup >/dev/null 2>&1
