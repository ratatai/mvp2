name: Claude development tasks

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: claude-task-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: >-
      github.event.comment.user.login == 'ratatai' &&
      contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: >-
            --max-turns 25
            --allowedTools "Bash(npm ci),Bash(npm run lint),Bash(npm run typecheck),Bash(npm run test),Bash(npm run build),Bash(git checkout -b:*),Bash(git show origin/main:CLAUDE.md),Bash(npm audit --package-lock-only --json),Bash(npm audit --omit=dev --package-lock-only --json),Bash(npm ls:*),Bash(npm explain:*),Bash(env -u NEXT_PUBLIC_SUPABASE_URL -u NEXT_PUBLIC_SUPABASE_ANON_KEY -u NEXT_PUBLIC_SITE_URL npm run build)"
